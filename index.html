<style>
/* Layout: one quiet column on deep maroon. Play = a stack of three cards you peel; Browse = a ruled list of every thread. Mobile first. */
:root {
  color-scheme: dark;
  --bg: #36101A;
  --bg-deep: #240A11;
  --ink: #F5E6E2;
  --ink-soft: #C6A2A5;
  --ink-faint: #8E676C;
  --line: #5A2431;
  --surface: #43151F;
  --accent: #E8C3AE;
  --accent-hover: #F2D3C2;
  --accent-ink: #36101A;
  --c-light: #F3E3DE;
  --c-medium: #D9A1A0;
  --c-deep: #7A2235;
  --c-deep-mark: #B8445C;
  --ink-on-light: #3A111B;
  --ink-on-deep: #F7E8E4;
  --shadow: 0 24px 40px -22px rgba(0, 0, 0, .75);
  --f-display: "Gloock", "Playfair Display", Georgia, serif;
  --f-q: "Newsreader", Georgia, "Times New Roman", serif;
  --f-ui: "Manrope", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
.play { display: flex; flex-direction: column; gap: 22px; }
.btn-main span { white-space: nowrap; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg-deep);
  background-image: radial-gradient(120% 70% at 50% 0%, var(--bg) 0%, var(--bg-deep) 100%);
  background-attachment: fixed;
  color: var(--ink);
  font: 500 15px/1.5 var(--f-ui);
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 540px; margin: 0 auto;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
button { font: inherit; color: inherit; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.label { font-size: .82rem; font-weight: 600; color: var(--ink-faint); }

/* Header */
header { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.logo { margin: 0; font: 400 2.3rem/1 var(--f-display); letter-spacing: -.01em; }
.logo em { font-style: normal; color: var(--accent); }
.tagline { margin: 6px 0 0; font: italic 400 1rem var(--f-q); color: var(--ink-soft); }
.views { display: flex; gap: 16px; padding-bottom: 2px; }
.views button { background: none; border: 0; padding: 8px 0; cursor: pointer; font-weight: 600; font-size: .92rem; color: var(--ink-faint); border-bottom: 1px solid transparent; transition: color .2s, border-color .2s; }
.views button:hover { color: var(--ink-soft); }
.views button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

/* Who */
.who { display: flex; flex-direction: column; gap: 10px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 12px 4px; cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--ink-soft); transition: background .3s, color .3s; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* Depth meter */
.meter { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.meter .step { display: flex; flex-direction: column; gap: 7px; font-size: .82rem; font-weight: 600; color: var(--ink-faint); transition: color .4s; }
.meter .bar { height: 3px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
.meter .bar::after { content: ""; position: absolute; inset: 0; transform: scaleX(0); transform-origin: left; transition: transform .5s ease; }
.meter .step[data-l="0"] .bar::after { background: var(--c-light); }
.meter .step[data-l="1"] .bar::after { background: var(--c-medium); }
.meter .step[data-l="2"] .bar::after { background: var(--c-deep-mark); }
.meter .step.on .bar::after { transform: scaleX(1); }
.meter .step.now { color: var(--ink); }

/* Card stack */
.stack { display: grid; padding-bottom: 20px; touch-action: none; user-select: none; -webkit-user-select: none; }
.card {
  grid-area: 1 / 1;
  background: var(--c-light); color: var(--ink-on-light);
  border-radius: 18px;
  padding: 22px 22px 20px;
  min-height: clamp(260px, 44svh, 380px);
  display: flex; flex-direction: column; gap: 16px;
  box-shadow: var(--shadow);
  transform-origin: 50% 0%;
  transform: translateY(calc(var(--k, 0) * 10px)) scale(calc(1 - var(--k, 0) * .04));
  z-index: calc(10 - var(--k, 0));
  transition: transform .5s cubic-bezier(.22,.8,.3,1), filter .5s;
  cursor: grab;
}
.card.dragging { transition: none; cursor: grabbing; }
.card[data-layer="1"] { background: var(--c-medium); }
.card[data-layer="2"] { background: var(--c-deep); color: var(--ink-on-deep); }
.card.behind { filter: brightness(.8); }
.card.behind > * { visibility: hidden; }
.card.gone { visibility: hidden; }
.card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tag { font-size: .85rem; font-weight: 600; opacity: .7; }
.num { font: italic 400 .95rem var(--f-q); opacity: .6; font-variant-numeric: tabular-nums; }
.q { margin: 0; flex: 1; font: 400 clamp(1.5rem, 6.4vw, 1.9rem)/1.22 var(--f-q); letter-spacing: -.005em; text-wrap: pretty; }

/* Controls */
.controls { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; }
.btn {
  height: 50px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line); background: transparent;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 600; font-size: .95rem; cursor: pointer; min-width: 0;
  transition: background .25s, border-color .25s, opacity .25s, transform .12s;
}
.btn:active { transform: scale(.97); }
.btn:hover { background: var(--surface); border-color: var(--ink-faint); }
.btn[disabled] { opacity: .35; cursor: default; }
.btn[disabled]:hover { background: transparent; border-color: var(--line); }
.btn-main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-main:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.heart[aria-pressed="true"] svg { fill: var(--accent); stroke: var(--accent); }
.how { margin: -8px 0 0; text-align: center; font-size: .8rem; color: var(--ink-faint); }
@media (max-width: 460px) {
  .controls { grid-template-columns: 50px 1fr 50px 50px; }
  .controls .lbl { display: none; }
  .controls .btn { padding: 0; }
  .controls .btn-main { padding: 0 12px; }
}

/* Browse */
.search {
  width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 12px;
  background: transparent; color: var(--ink); padding: 0 14px; font: 500 16px var(--f-ui);
}
.search::placeholder { color: var(--ink-faint); }
.tools { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

  const t = ALL.get(id); if (!t) return;
  const k = keyOf(id, l), i = saved.findIndex((s) => s.key === k);
  if (i >= 0) saved.splice(i, 1); else saved.unshift({ key: k, q: t.qs[l], aud: t.aud, layer: l });
  persist(); updateControls(); $("#saved-n").textContent = saved.length;
  if (view === "browse") renderBrowse(true);
}

/* Swipe and tap on the front card */
let drag = null;
stack.addEventListener("pointerdown", (e) => {
  const c = e.target.closest(".card");
  if (!c || busy || +c.dataset.layer !== layer) return;
  drag = { c, x: e.clientX, y: e.clientY, dx: 0, dy: 0, id: e.pointerId };
  c.classList.add("dragging");
  c.setPointerCapture(e.pointerId);
});
stack.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.dx = e.clientX - drag.x; drag.dy = e.clientY - drag.y;
  drag.c.style.transform = `translate(${drag.dx}px, ${Math.min(drag.dy, 30)}px) rotate(${drag.dx * 0.04}deg)`;
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const { c, dx, dy } = drag; drag = null;
  if (Math.hypot(dx, dy) < 8) { c.style.transform = ""; c.classList.remove("dragging"); peel(); return; }
  if (dy < -60 && -dy > Math.abs(dx)) { peel(); return; }
  if (Math.abs(dx) > 80) { newQuestion(dx > 0 ? 1 : -1); return; }
  c.classList.remove("dragging"); c.style.transform = "";
}
stack.addEventListener("pointerup", endDrag);
stack.addEventListener("pointercancel", endDrag);

$("#peel").addEventListener("click", peel);
backBtn.addEventListener("click", back);
$("#next").addEventListener("click", () => newQuestion(1));
saveBtn.addEventListener("click", () => cur && toggleSave(cur.id, layer));

/* ---------- Browse ---------- */
const openThreads = new Set();
function threadItem(t, note) {
  const seen = isSeen(t.id);
  const tag = note || (seen ? "Seen" : "");
  return `<li class="${seen ? "is-seen" : ""}"><details data-t="${t.id}" ${openThreads.has(t.id) ? "open" : ""}>
    <summary><span class="lq">${t.qs[0]}${tag ? `<span class="seen-tag label">${tag}</span>` : ""}</span><svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
    <div class="layers">
      ${t.qs.map((q, l) => { const on = isSaved(keyOf(t.id, l)); return `<div class="row"><span class="sw" style="background:${SWATCH[l]}"></span>
        <span class="txt"><span class="lname label">${LAYERS[l]}</span>${q}</span>
        <button type="button" class="mini" aria-pressed="${on}" aria-label="${on ? "Remove from saved" : "Save"}" data-save="${keyOf(t.id, l)}">${HEART}</button></div>`; }).join("")}
      <button type="button" class="play-link" data-play="${t.id}">Play this thread →</button>
    </div>
  </details></li>`;
}
function renderBrowse(keepOpen) {
  const list = $("#list"), term = $("#search").value.trim().toLowerCase();
  $("#saved-n").textContent = saved.length;
  if (!keepOpen) openThreads.clear();
  if (historyOnly) {
    const items = hist.session.items.map((x) => ({ t: ALL.get(x.id), layer: x.layer })).filter((x) => x.t && (!term || x.t.qs.some((q) => q.toLowerCase().includes(term))));
    $("#count").textContent = "";
    list.innerHTML = `<li class="hist-head"><p class="label">This session · ${items.length} question${items.length === 1 ? "" : "s"}</p>
        <button type="button" class="text-btn" data-new-session>Start a new session</button></li>`
      + (items.length ? items.map((x) => threadItem(x.t, `${AUD_NAMES[x.t.aud]} · reached ${LAYERS[x.layer]}`)).join("")
        : `<li class="empty">${term ? "Nothing from this session matches that search." : "Questions you go through will show up here."}</li>`);
    return;
  }
  if (savedOnly) {
    const items = saved.filter((s) => !term || s.q.toLowerCase().includes(term));
    $("#count").textContent = `${items.length} saved`;
    list.innerHTML = items.length ? items.map((s) => `<li class="saved-item"><span class="sw" style="background:${SWATCH[s.layer]}"></span>
        <span class="txt">${s.q}<span class="sub label">${AUD_NAMES[s.aud]} · ${LAYERS[s.layer]}</span></span>
        <button type="button" class="mini" aria-pressed="true" aria-label="Remove from saved" data-save="${s.key}">${HEART}</button></li>`).join("")
      : `<li class="empty">${term ? "No saved questions match that search." : "Nothing saved yet. Tap the heart on any question to keep it here."}</li>`;
    return;
  }
  const inDeck = deckThreads(aud);
  const rows = inDeck.filter((t) => !term || t.qs.some((q) => q.toLowerCase().includes(term)));
  const k = rows.filter((t) => t.know), m = rows.filter((t) => t.match), g = rows.filter((t) => !t.match && !t.know && !t.fresh);
  $("#count").textContent = "";
  const head = `<li class="hist-head"><p class="label">${term ? `${rows.length} threads match` : `${AUD_NAMES[aud]} · ${inDeck.length} threads · ${inDeck.length * 3} questions`}</p>
      <button type="button" class="text-btn" data-new-deck>New deck</button></li>`;
  if (!rows.length) { list.innerHTML = head + `<li class="empty">Nothing matches that search. Try another word.</li>`; return; }
  const sec = (title, items) => items.length ? `<li class="group-h">${title}</li>` + items.map((t) => threadItem(t)).join("") : "";
  const g2 = rows.filter((t) => t.fresh).concat(g);
  const grouped = k.length || m.length;
  list.innerHTML = head + sec("Who they really are", k) + sec("For " + pairName(), m) + (grouped ? sec("More " + AUD_NAMES[aud] + " questions", g2) : g2.map((t) => threadItem(t)).join(""));
}
$("#list").addEventListener("toggle", (e) => {
  const d = e.target; if (!d.dataset || !d.dataset.t) return;
  d.open ? openThreads.add(d.dataset.t) : openThreads.delete(d.dataset.t);
}, true);
$("#list").addEventListener("click", (e) => {
  const s = e.target.closest("[data-save]");
  if (s) { const [id, l] = s.dataset.save.split("@"); toggleSave(id, +l); return; }
  if (e.target.closest("[data-new-session]")) { newSession(); return; }
  if (e.target.closest("[data-new-deck]")) { newDeck(); return; }
  const p = e.target.closest("[data-play]");
  if (p) { cur = ALL.get(p.dataset.play); layer = 0; setView("play"); buildStack(true); window.scrollTo({ top: 0 }); }
});
$("#search").addEventListener("input", () => renderBrowse(false));
function setFilter(which) {
  savedOnly = which === "saved" ? !savedOnly : false;
  historyOnly = which === "history" ? !historyOnly : false;
  $("#saved-only").setAttribute("aria-pressed", savedOnly ? "true" : "false");
  $("#history-only").setAttribute("aria-pressed", historyOnly ? "true" : "false");
  renderBrowse(false);
}
$("#saved-only").addEventListener("click", () => setFilter("saved"));
$("#history-only").addEventListener("click", () => setFilter("history"));

function newSession() {
  hist.session = { start: Date.now(), items: [] };
  markSeen(cur, layer);
  toast("New session started");
  if (view === "browse") renderBrowse(false);
}
function newDeck() {
  shown[aud] = makeDeck(aud, new Set((shown[aud] || []).concat(cur ? [cur.id] : [])));
  saveShown();
  decks[aud] = null; delete spots[aud];
  toast(`New deck · ${shown[aud].length} ${AUD_NAMES[aud]} threads`);
  if (view === "browse") { renderBrowse(false); return; }
  newQuestion(1);
}
$("#new-deck").addEventListener("click", newDeck);
function resetSeen() {
  hist = { seen: {}, session: { start: Date.now(), items: [] }, last: Date.now() };
  decks = {}; shown = {}; saveShown();
  markSeen(cur, layer);
  toast("Every question is new again");
  if (view === "browse") renderBrowse(false);
}
$("#open-history").addEventListener("click", () => {
  setView("browse");
  if (!historyOnly) setFilter("history");
  window.scrollTo({ top: 0 });
});

/* ---------- Types picker ---------- */
const youSel = $("#type-you"), themSel = $("#type-them");
[youSel, themSel].forEach((sel) => { sel.innerHTML = `<option value="">Choose</option>` + TYPES.map((t) => `<option value="${t}">${t}</option>`).join(""); });
const matchSwitch = $("#match-switch");
function syncTypes() {
  youSel.value = types.you; themSel.value = types.them;
  matchSwitch.setAttribute("aria-checked", matchOn ? "true" : "false");
  $("#match-fields").hidden = !matchOn;
}
function applyTypes() {
  types = { you: youSel.value, them: themSel.value };
  try { localStorage.setItem("askie-types", JSON.stringify(types)); } catch (e) {}
  syncTypes();
  decks.date = null;
  if (aud !== "date") return;
  if (view === "browse") renderBrowse(false);
}
[youSel, themSel].forEach((sel) => sel.addEventListener("change", applyTypes));
matchSwitch.addEventListener("click", () => {
  matchOn = !matchOn;
  try { localStorage.setItem("askie-match", matchOn ? "1" : "0"); } catch (e) {}
  applyTypes();
});

const sheet = $("#settings"), scrim = $("#scrim");
function openSettings() { sheet.hidden = false; scrim.hidden = false; $("#close-settings").focus(); }
function closeSettings() { sheet.hidden = true; scrim.hidden = true; $("#open-settings").focus(); }
$("#open-settings").addEventListener("click", () => { updateHistoryCounts(); openSettings(); });
$("#new-session").addEventListener("click", newSession);
$("#reset-seen").addEventListener("click", resetSeen);
$("#close-settings").addEventListener("click", closeSettings);
/* Jokes panel */
const jokesSheet = $("#jokes");
let jokeKind = "dad", jokeLang = "en", jokeDecks = {}, revealed = false;
function nextJoke() {
  const list = JOKES[jokeLang][jokeKind], dk = jokeLang + jokeKind;
  if (!jokeDecks[dk] || !jokeDecks[dk].length) jokeDecks[dk] = shuffle(list.map((_, i) => i));
  const [setup, punch] = list[jokeDecks[dk].pop()];
  $("#joke").setAttribute("lang", jokeLang);
  $("#joke-setup").textContent = setup; $("#joke-punch").textContent = punch;
  $("#joke-punch").hidden = true; revealed = false; $("#joke-btn").textContent = "Reveal";
}
function jokeStep() {
  if (!revealed) { $("#joke-punch").hidden = false; revealed = true; $("#joke-btn").textContent = "Another one"; }
  else nextJoke();
}
$("#joke-btn").addEventListener("click", jokeStep);
$("#joke").addEventListener("click", () => { if (!revealed) jokeStep(); });
document.querySelectorAll("#jokes .seg button").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.kind) jokeKind = b.dataset.kind; else jokeLang = b.dataset.lang;
  b.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  nextJoke();
}));
function openJokes() { nextJoke(); jokesSheet.hidden = false; scrim.hidden = false; $("#joke-btn").focus(); }
function closeJokes() { jokesSheet.hidden = true; scrim.hidden = true; $("#open-jokes").focus(); }
$("#open-jokes").addEventListener("click", openJokes);
$("#close-jokes").addEventListener("click", closeJokes);
const anySheetOpen = () => !sheet.hidden || !jokesSheet.hidden;
function closeAny() { if (!sheet.hidden) closeSettings(); if (!jokesSheet.hidden) closeJokes(); }
scrim.addEventListener("click", closeAny);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && anySheetOpen()) closeAny(); });

/* ---------- Views + audience ---------- */
function setView(v, fromHash) {
  view = v === "browse" ? "browse" : "play";
  $("#play").hidden = view !== "play";
  $("#browse").hidden = view !== "browse";
  document.querySelectorAll(".views button").forEach((b) => {
    if (b.dataset.view === view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  if (view === "browse") renderBrowse(false);
  if (!fromHash) { try { history.replaceState(null, "", "#" + view); } catch (e) {} }
}
document.querySelectorAll(".views button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
window.addEventListener("hashchange", () => setView(location.hash === "#browse" ? "browse" : "play", true));

document.querySelectorAll(".who .seg button").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.aud === aud) return;
  spots[aud] = { cur, layer };
  aud = b.dataset.aud;
  document.querySelectorAll(".who .seg button").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  syncTypes();
  busy = false;
  const back = spots[aud];
  if (back) { cur = back.cur; layer = back.layer; } else { cur = nextThread(); layer = 0; }
  buildStack(false);
  if (view === "browse") renderBrowse(false);
}));

document.addEventListener("keydown", (e) => {
  if (view !== "play" || anySheetOpen() || e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, select")) return;
  const k = e.key.toLowerCase();
  if (e.key === " " || e.key === "ArrowDown") { if (e.target.closest("button")) return; e.preventDefault(); peel(); }
  else if (e.key === "ArrowUp" || k === "b") back();
  else if (e.key === "ArrowRight" || k === "n") newQuestion(1);
  else if (e.key === "ArrowLeft") newQuestion(-1);
  else if (k === "s" && cur) toggleSave(cur.id, layer);
});

syncTypes();
cur = nextThread();
buildStack(false);
updateHistoryCounts();
$("#saved-n").textContent = saved.length;
setView(location.hash === "#browse" ? "browse" : "play", true);
</script>

</body>
</html>
